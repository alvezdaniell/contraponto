return `<div class="A" style="inset:0;background:${K}"></div>`+(s?ph(s,'left:0;top:0;width:1080px;height:720px')+`<div class="A" style="left:0;top:380px;width:1080px;height:340px;background:linear-gradient(transparent,${K})"></div>`:'')+bar(L)+`<div class="A h" style="left:64px;top:${s?110:100}px;font-size:${s?200:300}px;color:${L};line-height:1">${n}</div><div class="A" style="left:64px;right:64px;top:${s?740:400}px">${body(C,O)}</div>`+tail+foot(d,56)}
function bwp(src,bw){return new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),w=Math.min(1400,im.width);c.width=w;c.height=im.height*w/im.width;const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);if(bw){const a=x.getImageData(0,0,c.width,c.height),p=a.data;for(let i=0;i<p.length;i+=4){let g=.3*p[i]+.59*p[i+1]+.11*p[i+2];g=Math.max(0,Math.min(255,(g-128)*1.35+128));p[i]=p[i+1]=p[i+2]=g}x.putImageData(a,0,0)}res(c.toDataURL('image/jpeg',.85))};im.src=src})}
async function procAll(){const d=D[cur];d.imgs=await Promise.all((d.origs||[]).map(s=>bwp(s,d.bw)))}
function nav(){$('#nav').innerHTML=T.map(t=>`<button class="${cur==t.id?'on':''}" onclick="sel(${t.id})">${t.n}</button>`).join('')+`<button class="${cur==0?'on':''}" onclick="sel(0)">Galeria</button>`}
function sel(i){cur=i;pg=0;nav();view()}
function fit(){const w=$('#prev');if(!w)return;const a=w.firstElementChild,s=w.clientWidth/1080;a.style.transform=`scale(${s})`;a.style.transformOrigin='top left';w.style.height=a.offsetHeight*s+'px'}
function draw(){const t=T[cur-1],n=pages(t);pg=Math.min(pg,n-1);$('#prev').innerHTML=art(t,D[cur],pg);fit();if($('#pn'))$('#pn').textContent=`Página ${pg+1} de ${n}`}

if(cur==0){$('#app').innerHTML=`<div class="grid">${T.map(t=>`<div class="cell" onclick="sel(${t.id})"><div class="gw" style="width:100%"></div><span>${t.n}</span></div>`).join('')}</div><p class="note">Todos os modelos usam as mesmas cores, fontes, margens e rodapé. Toque em um para editar. Conteúdo de exemplo fictício.</p>`;
document.querySelectorAll('.gw').forEach((g,i)=>{const w=g.clientWidth,t=T[i];g.innerHTML=`<div style="width:1080px;transform:scale(${w/1080});transform-origin:top left">${art(t,D[t.id],0)}</div>`;g.style.height=t.H*w/1080+'px';g.style.overflow='hidden'});return}
const t=T[cur-1],d=D[cur],f=(k,lb,ta)=>`<label>${lb}</label>${ta?`<textarea data-k="${k}">${esc(d[k])}</textarea>`:`<input type="text" data-k="${k}" value="${esc(d[k])}">`}`;
$('#app').innerHTML=`<div id="prev"></div>${t.id==2?`<div class="row"><button class="btn" onclick="pg=Math.max(0,pg-1);draw()">←</button><span id="pn"></span><button class="btn" onclick="pg=Math.min(pages(T[1])-1,pg+1);draw()">→</button></div>`:''}<div class="row"><button class="btn pri" onclick="exp()">Exportar PNG</button></div>
${t.id==10?`<label>Tipo de story</label><select data-k="v">${VARS.map(e=>`<option ${e==d.v?'selected':''}>${e}</option>`).join('')}</select>`:''}<label>Editoria</label><select data-k="tag">${Object.keys(E).map(e=>`<option ${e==d.tag?'selected':''}>${e}</option>`).join('')}</select>
${sw('ac','Cor de destaque (laranja)')}${sw('bg','Cor de fundo')}${f('h','Manchete (use | para cor de destaque)',1)}${f('s','Subtítulo / assinatura / legenda')}${f('meta','Data, contexto ou período')}${f('body',t.id==2?'Páginas (separe com linha em branco; 1ª linha = título)':t.id==4?'Barras (rótulo|valor, uma por linha)':t.id==5?'Trecho exato da fala':t.id==8?'Serviço (ROTULO|valor, uma por linha)':t.id==10?'Opções da enquete (uma por linha)':'Texto extra',1)}${t.id==4?f('big','Dado principal'):''}${f('src','Fonte')}${f('credit','Crédito da foto')}${f('n','Número da publicação')}
${t.id==-1?`<label>Variação</label><select data-k="v">${VARS.map(e=>`<option ${e==d.v?'selected':''}>${e}</option>`).join('')}</select>`:''}
<label>${cur==2?'Fotos (escolha várias, uma por página)':'Foto'}</label><input type="file" accept="image/*" id="fi"><div class="row"><label style="margin:0"><input type="checkbox" id="bw" ${d.bw?'checked':''}> Preto e branco</label></div>`;
document.querySelectorAll('[data-k]').forEach(e=>e.oninput=()=>{d[e.dataset.k]=e.value;draw()});
$('#fi').multiple=cur==2;$('#fi').onchange=e=>{if(cur==2){const fl=[...e.target.files];Promise.all(fl.map(f=>new Promise(r=>{const q=new FileReader();q.onload=()=>r(q.result);q.readAsDataURL(f)}))).then(async a=>{d.origs=a;await procAll();draw()});return}const r=new FileReader();r.onload=()=>{d.orig=r.result;proc()};r.readAsDataURL(e.target.files[0])};
$('#bw').onchange=e=>{d.bw=e.target.checked;proc()};draw()}
function setc(k,c){D[cur][k]=c;view()}
function sw(k,lb){const d=D[cur];return `<label>${lb}</label><div class="row"><input type="color" data-k="${k}" value="${d[k]||(k=='ac'?'#FF4D00':'#0B0B0B')}" style="width:56px;height:44px;padding:0;border:0">${['#FF4D00','#C6FF00','#6A3BFF','#F2EFE9','#0B0B0B'].map(c=>`<button class="btn" style="background:${c};width:36px;height:36px;padding:0" onclick="setc('${k}','${c}')"></button>`).join('')}<button class="btn" onclick="setc('${k}','')">padrão</button></div>`}
function proc(){const d=D[cur];if(d.origs&&d.origs.length)procAll().then(draw);if(!d.orig)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),w=Math.min(1400,im.width);c.width=w;c.height=im.height*w/im.width;const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);if(d.bw){const a=x.getImageData(0,0,c.width,c.height),p=a.data;for(let i=0;i<p.length;i+=4){let g=.3*p[i]+.59*p[i+1]+.11*p[i+2];g=Math.max(0,Math.min(255,(g-128)*1.35+128));p[i]=p[i+1]=p[i+2]=g}x.putImageData(a,0,0)}d.img=c.toDataURL('image/jpeg',.88);draw()};im.src=d.orig}
async function exp(){const t=T[cur-1],h=document.createElement('div');h.style.cssText='position:fixed;left:-9999px;top:0';h.innerHTML=art(t,D[cur],pg);document.body.appendChild(h);try{await document.fonts.ready;const c=await html2canvas(h.firstChild,{scale:1,useCORS:true,width:1080,height:t.H,backgroundColor:K});$('#oi').src=c.toDataURL('image/png');$('#ov').style.display='flex'}catch(e){alert('Não foi possível exportar. Tente com outra foto.')}h.remove()}
